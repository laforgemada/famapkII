<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="google-site-verification" content="6a31d6b715b74e93" />
<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no,
               viewport-fit=cover">

<title>Apokalypsy | Experience</title>

<script>
    // Appliqué immédiatement (avant le CSS/rendu) pour éviter le flash de thème clair
    (function() {
        try {
            const saved = localStorage.getItem('theme');
            const theme = saved || (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
            document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {}
    })();
</script>

<link rel="preload" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'">
<link rel="icon" type="image/png" href="/famapkII/logo/logo.png">
<noscript><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"></noscript>

<script src="https://unpkg.com/feather-icons"></script>

<link rel="manifest" href="manifest.json">

<link rel="stylesheet" href="css/styles.css">

<style>
    /* =========================
    MODE SOMBRE
    (mêmes variables que bible.html / espace_personnel.html,
    pour rester cohérent quelle que soit la page)
    ========================= */
    html[data-theme="dark"] {
        --bg:#0a0a0d;
        --surface:#16171d;
        --text:#f5f5f7;
        --text-main:#f5f5f7;
        --muted:#9a9ba7;
        --text-muted:#9a9ba7;
        --border:rgba(255,255,255,0.08);
        --border-color:rgba(255,255,255,0.08);
    }
    html[data-theme="dark"] body {
        background: var(--bg);
        color: var(--text-main, var(--text));
    }
    body {
        transition: background 0.25s ease, color 0.25s ease;
    }

    /* =========================
    CONTRÔLES FLOTTANTS (thème + points)
    Autonomes : ne dépendent pas du header injecté par js/include.js
    ========================= */
    #floating-controls {
        position: fixed;
        bottom: calc(88px + env(safe-area-inset-bottom, 0px));
        right: 18px;
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 12px;
        z-index: 2000;
    }
    #points-fab {
        display: none;
        align-items: center;
        gap: 6px;
        background: rgba(245,158,11,0.16);
        border: 1px solid rgba(245,158,11,0.35);
        color: #f59e0b;
        font-weight: 900;
        font-size: 0.78rem;
        padding: 9px 14px;
        border-radius: 100px;
        backdrop-filter: blur(10px);
        box-shadow: 0 10px 25px rgba(0,0,0,0.12);
    }
    #points-fab i { width: 14px; height: 14px; }
    #theme-fab {
        width: 50px;
        height: 50px;
        border-radius: 50%;
        border: none;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        background: #4aadde;
        color: #fff;
        box-shadow: 0 10px 25px rgba(22,163,74,0.4);
        transition: background 0.2s ease, transform 0.2s ease;
    }
    #theme-fab:hover { transform: translateY(-2px); }
    #theme-fab:active { transform: scale(0.95); }
    #theme-fab i { width: 20px; height: 20px; stroke-width: 2.2; }
    html[data-theme="dark"] #theme-fab .feather-moon { display:none; }
    html[data-theme="dark"] #theme-fab .feather-sun { display:inline-flex; }
    #theme-fab .feather-sun { display:none; }
</style>
<style>
/* =========================
    STYLES DU MODAL ARTICLE ET BOUTON "LIRE PLUS"
    ========================= */
    .article-modal-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.6);
        backdrop-filter: blur(5px);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 3000;
        opacity: 0;
        visibility: hidden;
        transition: opacity 0.3s ease, visibility 0.3s ease;
        padding: 16px;
        box-sizing: border-box;
    }
    .article-modal-overlay.active {
        opacity: 1;
        visibility: visible;
    }
    .article-modal-content {
        background: var(--surface, #ffffff);
        color: var(--text-main, #1e293b);
        width: 100%;
        max-width: 650px;
        max-height: 85vh;
        border-radius: 24px;
        box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
        display: flex;
        flex-direction: column;
        position: relative;
        overflow-y: auto;
        transform: translateY(20px);
        transition: transform 0.3s ease;
        padding: 24px;
        box-sizing: border-box;
        border: 1px solid var(--border, transparent);
    }
    .article-modal-overlay.active .article-modal-content {
        transform: translateY(0);
    }
    .article-modal-close {
        position: absolute;
        top: 16px;
        right: 16px;
        background: var(--border, #e2e8f0);
        border: none;
        width: 36px;
        height: 36px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        color: var(--text-main, #1e293b);
        z-index: 10;
    }
    .article-modal-body img {
        width: 100%;
        max-height: 300px;
        object-fit: cover;
        border-radius: 16px;
        margin-bottom: 16px;
    }
    .article-modal-body h2 {
        font-size: 1.25rem;
        font-weight: 700;
        margin: 0 0 12px 0;
    }
    .article-modal-body div {
        font-size: 0.95rem;
        line-height: 1.6;
        color: var(--text-muted, #64748b);
    }
    .btn-read-more {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        background: transparent;
        border: 1px solid #4aadde;
        color: #4aadde;
        font-weight: 700;
        font-size: 0.85rem;
        padding: 8px 14px;
        border-radius: 100px;
        cursor: pointer;
        margin-top: 12px;
        transition: all 0.2s ease;
    }
    .btn-read-more:hover {
        background: #4aadde;
        color: #ffffff;
    }
</style>
</head>

<body>

<div id="header"></div>

<section class="hero">
    <div class="hero-content">
        <div class="hero-buttons">
            <button class="hero-btn primary-btn" onclick="window.location.href='bible.html'">
                <i data-feather="book-open"></i> <span id="hero-btn-explore-bible">Explorer la Bible</span>
            </button>
            <button class="hero-btn secondary-btn" onclick="window.location.href='chat.html'">
                <i data-feather="message-circle"></i> <span id="hero-btn-join-chat">Rejoindre le Chat</span>
            </button>
        </div>

        <div class="hero-stats">
		<div class="stat-box">
			<div class="stat-number" id="stat-members">...</div>
			<div class="stat-label">Membres</div>
		</div>
		<div class="stat-box">
			<div class="stat-number" id="stat-articles">...</div>
			<div class="stat-label">Articles</div>
		</div>
		<div class="stat-box">
			<div class="stat-number" id="stat-chat">24/7</div>
			<div class="stat-label">Chat en direct</div>
		</div>
	</div>
		
    </div>
</section>

<div class="section-label" id="label-mavitrika">🏆 Membres actifs</div>

<div class="podium-box" id="leaderboard-podium">
    <div style="color: var(--text-muted); font-weight: 700; font-size: 0.9rem;">Chargement du podium...</div>
</div>

<div class="section-label" id="label-fampianarana">📚 Enseignements</div>

<div class="category-scroll" id="cat-list"></div>

<div class="premium-banner">
    <div class="premium-left">
        <div class="premium-mini-badge">
            <i data-feather="star"></i> <span id="premium-zone-text">Zone Premium</span>
        </div>
        <div class="premium-title" id="premium-banner-title">Événements & Récompenses</div>
        <div class="premium-text" id="premium-banner-text">Suivez votre progression, gagnez des badges et recevez des bonus quotidiens.</div>
    </div>
    <div class="premium-right">
        <i data-feather="award"></i>
    </div>
</div>

<div class="container" id="articles-container"></div>

<div id="pagination-controls"></div>

<div id="footer"></div>

<div id="floating-controls">
    <div class="points-badge" id="points-fab" title="Vos points de lecture">
        <i data-feather="award"></i>
        <span id="points-fab-value">0</span>
    </div>
    <button id="theme-fab" aria-label="Changer de thème (clair/sombre)" onclick="toggleTheme()">
        <i data-feather="moon" class="feather-moon"></i>
        <i data-feather="sun" class="feather-sun"></i>
    </button>
</div>

<!-- MODAL DE LECTURE D'ARTICLE -->
<div id="article-modal" class="article-modal-overlay">
    <div class="article-modal-content">
        <button class="article-modal-close" onclick="closeArticleModal()" aria-label="Fermer">
            <i data-feather="x"></i>
        </button>
        <div class="article-modal-body">
            <img id="modal-article-img" src="" alt="Illustration article" style="display:none;">
            <h2 id="modal-article-title"></h2>
            <div id="modal-article-text"></div>
        </div>
    </div>
</div>

<script>
    // Mode sombre : identique à bible.html / espace_personnel.html
    function toggleTheme() {
        const html = document.documentElement;
        const current = html.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
        const next = current === 'dark' ? 'light' : 'dark';
        html.setAttribute('data-theme', next);
        try { localStorage.setItem('theme', next); } catch (e) {}
    }

    // Points : affiche la valeur mise en cache par bible.html / espace_personnel.html
    // (la clé localStorage "cachedPointsTotal" est partagée entre les pages)
    (function initPointsFab() {
        try {
            const username = localStorage.getItem('user_name');
            const cached = parseFloat(localStorage.getItem('cachedPointsTotal'));
            if (username && !isNaN(cached)) {
                const badge = document.getElementById('points-fab');
                const value = document.getElementById('points-fab-value');
                value.innerText = Math.round(cached * 10) / 10;
                badge.style.display = 'flex';
            }
        } catch (e) {}
    })();

    document.addEventListener('DOMContentLoaded', () => {
        if (window.feather) feather.replace();
    });
</script>

<script src="js/include.js"></script>

<script src="js/functions.js"></script>

</body>
</html>
