<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apokalypsy - Gestion des Articles</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <link rel="stylesheet" href="../css/admin-style.css">

    <style>
        /* Protection anti-flash : Masque le contenu pendant la vérification du rôle */
        body {
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .image-mode-selector{
            display:flex;
            gap:10px;
            margin-bottom:10px;
        }

        .btn-mode{
            padding:5px 12px;
            border-radius:6px;
            border:1px solid #ddd;
            cursor:pointer;
            font-size:.8rem;
            background:#fff;
        }

        .btn-mode.active{
            background:#1e293b;
            color:white;
            border-color:#1e293b;
        }

        .crud-container{
            background:white;
            border-radius:12px;
            padding:20px;
            box-shadow:0 4px 6px -1px rgb(0 0 0 / 0.1);
            margin-top:40px;
        }

        .article-table{
            width:100%;
            border-collapse:collapse;
            margin-top:20px;
        }

        .article-table th,
        .article-table td{
            text-align:left;
            padding:12px;
            border-bottom:1px solid #edf2f7;
        }

        .article-table th{
            background:#f8fafc;
            color:#64748b;
            font-weight:600;
        }

        .actions{
            display:flex;
            gap:8px;
        }

        .btn-action{
            padding:8px;
            border-radius:6px;
            border:none;
            cursor:pointer;
            color:white;
            transition:0.2s;
        }

        .btn-view{
            background:#3b82f6;
        }

        .btn-edit{
            background:#10b981;
        }

        .btn-delete{
            background:#ef4444;
        }

        .btn-action:hover{
            opacity:.8;
        }

        .thumbnail-list{
            width:50px;
            height:35px;
            object-fit:cover;
            border-radius:4px;
        }

        #fileInputContainer{
            display:none;
        }

        .modal{
            position:fixed;
            inset:0;
            background:rgba(0,0,0,0.7);
            display:none;
            align-items:center;
            justify-content:center;
            z-index:9999;
        }

        .modal-content{
            background:white;
            width:90%;
            max-width:700px;
            border-radius:12px;
            overflow:hidden;
            max-height:90vh;
            overflow-y:auto;
        }

        .modal img{
            width:100%;
            max-height:300px;
            object-fit:cover;
        }

        .modal-body{
            padding:20px;
        }

        .close-modal{
            position:absolute;
            top:20px;
            right:20px;
            background:red;
            color:white;
            border:none;
            width:40px;
            height:40px;
            border-radius:50%;
            cursor:pointer;
        }

        /* Nouveaux styles pour la sélection multiple */
        .table-header-flex {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .btn-bulk-delete {
            background: #ef4444;
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
            display: none; /* Masqué par défaut */
            transition: 0.2s;
        }
        .btn-bulk-delete:hover {
            background: #dc2626;
        }
        .checkbox-col {
            width: 40px;
            text-align: center !important;
        }

        /* Styles pour les messages flash */
        #flash-container {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 10000;
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-width: 350px;
        }

        .flash-message {
            background: #ffffff;
            color: #1e293b;
            padding: 14px 18px;
            border-radius: 8px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -4px rgba(0, 0, 0, 0.1);
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 0.9rem;
            border-left: 4px solid #3b82f6;
            animation: slideIn 0.3s ease forwards;
            opacity: 0;
            transform: translateY(-20px);
        }

        .flash-message.success {
            border-left-color: #10b981;
        }

        .flash-message.success i {
            color: #10b981;
        }

        .flash-message.error {
            border-left-color: #ef4444;
        }

        .flash-message.error i {
            color: #ef4444;
        }

        @keyframes slideIn {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes slideOut {
            to {
                opacity: 0;
                transform: translateX(100%);
            }
        }

        /* Styles Responsive */
        @media (max-width: 768px) {
            .main-content {
                padding: 20px;
                margin-left: 0; /* Pour les écrans mobiles, la sidebar sera masquée ou un menu hamburger */
            }

            .crud-container, .editor-container {
                padding: 15px;
            }

            .table-header-flex {
                flex-direction: column;
                align-items: flex-start;
                gap: 10px;
            }

            .btn-bulk-delete {
                width: 100%;
                text-align: center;
            }

            .article-table th, .article-table td {
                padding: 8px;
                font-size: 0.85rem;
            }
        }

        @media (max-width: 480px) {
            h1 {
                font-size: 1.8rem;
            }

            .btn-mode {
                font-size: 0.75rem;
                padding: 4px 10px;
            }

            .btn-publish, .btn-bulk-delete {
                font-size: 0.8rem;
                padding: 10px 15px;
            }
            .actions {
                flex-direction: column;
                gap: 4px;
            }
            .btn-action {
                padding: 6px;
                font-size: 0.7rem;
            }
        }

        /* Styles pour la pagination */
        .pagination-controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            margin-top: 25px;
            flex-wrap: wrap; /* Permet aux boutons de passer à la ligne */
        }

        .pagination-button {
            background: #e2e8f0;
            color: #475569;
            border: 1px solid #cbd5e1;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.2s ease;
            min-width: 40px; /* Taille minimale pour les boutons */
            text-align: center;
        }

        .pagination-button:hover:not(.active):not(:disabled) {
            background: #cbd5e1;
            color: #1e293b;
        }

        .pagination-button.active {
            background: #1e293b;
            color: white;
            border-color: #1e293b;
        }

        .pagination-button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .table-responsive {
            max-width: 100%;
            overflow-x: auto; /* Permet le défilement horizontal de la table */
            -webkit-overflow-scrolling: touch; /* Améliore le défilement sur iOS */
        }
    </style>
</head>

<body>

<!-- Sidebar toggle button for mobile -->
<button id="sidebarToggle" class="sidebar-toggle" onclick="toggleSidebar()">
    <i class="fa-solid fa-bars"></i>
</button>

<!-- Overlay for when sidebar is open on mobile -->
<div class="overlay" onclick="toggleSidebar()"></div>

<!-- Conteneur des messages flash -->
<div id="flash-container"></div>

<div id="sidebar-placeholder"></div>
<div id="header-placeholder"></div>

<main class="main-content">

    <div style="margin-bottom:30px;">
        <h1>Gestion des Articles</h1>
        <p style="color:#64748b;">
            Rédigez, modifiez et gérez vos publications pour apokalypsy.com.
        </p>
    </div>

    <form class="editor-container" id="articleForm">

        <input type="hidden" id="articleId">

        <div class="form-group">
            <label>Titre de l'article</label>

            <input type="text"
                   id="title"
                   placeholder="Ex: Les secrets de la tech..."
                   required>
        </div>

        <div class="form-group">
            <label>Catégorie</label>
            <select id="category" style="width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #ddd;" required>
                <option value="">-- Sélectionner une catégorie --</option>
                <option value="sermons">Sermons</option>
                <option value="propheties">Prophéties</option>
                <option value="chants">Chants</option>
                <option value="actualite">Actualité</option>
            </select>
        </div>

        <div class="form-group">

            <label>Image de couverture</label>

            <div class="image-mode-selector">
                <button type="button"
                        class="btn-mode active"
                        onclick="switchImageMode('url')">
                    Lien URL
                </button>

                <button type="button"
                        class="btn-mode"
                        onclick="switchImageMode('file')">
                    Parcourir fichier
                </button>
            </div>

            <div id="urlInputContainer">
                <input type="text"
                       id="image_url"
                       placeholder="https://image.jpg"
                       oninput="previewImage('url')">
            </div>

            <div id="fileInputContainer">
                <input type="file"
                       id="image_file"
                       accept="image/*"
                       onchange="previewImage('file')">
            </div>

            <img id="imagePreview"
                 alt="Aperçu"
                 style="width:100%;
                        max-height:200px;
                        object-fit:cover;
                        border-radius:10px;
                        margin-top:10px;
                        display:none;">
        </div>

        <div class="form-group">

            <label>Contenu</label>

            <textarea id="content"
                      rows="10"
                      placeholder="Écrivez ici..."
                      required></textarea>
        </div>

        <button type="submit"
                class="btn-publish"
                id="btnSubmit">

            <i class="fa-solid fa-paper-plane"></i>
            PUBLIER L'ARTICLE
        </button>

    </form>

    <div class="crud-container">

        <div class="table-header-flex">
            <h3>Mes Publications</h3>
            <button id="btnBulkDelete" class="btn-bulk-delete" onclick="deleteSelectedArticles()">
                <i class="fa-solid fa-trash-can"></i> Supprimer la sélection (<span id="selectedCount">0</span>)
            </button>
        </div>

        <div class="table-responsive">
            <table class="article-table">

                <thead>
                <tr>
                    <th class="checkbox-col"><input type="checkbox" id="selectAll" onclick="toggleSelectAll(this)"></th>
                    <th>Image</th>
                    <th>Titre</th>
                    <th>Catégorie</th>
                    <th>Date</th>
                    <th>Actions</th>
                </tr>
                </thead>

                <tbody id="articleTableBody">

                <tr>
                    <td colspan="6" style="text-align:center;">
                        Chargement...
                    </td>
                </tr>

                </tbody>

            </table>
        </div>

        <div id="pagination-controls" class="pagination-controls"></div>

    </div>

</main>

<div class="modal" id="viewModal">

    <button class="close-modal"
            onclick="closeModal()">
        X
    </button>

    <div class="modal-content">

        <img id="modalImage">

        <div class="modal-body">

            <h2 id="modalTitle"></h2>

            <p id="modalContent"></p>

        </div>

    </div>

</div>

<script>

    const API_BASE = "https://apokalypsy.com/api/articles";
    const articlesPerPage = 5; // Nombre d'articles par page
    let currentPage = 1; // Page actuelle

    let allArticles = [];
    let filteredArticles = []; // Articles après filtrage, avant pagination
    let selectedArticleIds = []; // Pour stocker les IDs des articles sélectionnés pour la suppression multiple

    // =========================
    // SYSTEME DE MESSAGES FLASH
    // =========================
    function showFlash(message, type = 'success') {
        const container = document.getElementById('flash-container');
        
        const flash = document.createElement('div');
        flash.className = `flash-message ${type}`;
        
        const icon = type === 'success' 
            ? '<i class="fa-solid fa-circle-check fa-lg"></i>' 
            : '<i class="fa-solid fa-circle-exclamation fa-lg"></i>';
            
        flash.innerHTML = `${icon} <span>${message}</span>`;
        
        container.appendChild(flash);
        
        // Disparition automatique après 3.5 secondes
        setTimeout(() => {
            flash.style.animation = 'slideOut 0.3s ease forwards';
            setTimeout(() => {
                flash.remove();
            }, 300);
        }, 3500);
    }

    // =========================
    // TOGGLE SIDEBAR
    // =========================
    function toggleSidebar() {
        const sidebar = document.getElementById('admin-sidebar');
        const overlay = document.querySelector('.overlay');
        if (sidebar && overlay) {
            sidebar.classList.toggle('active');
            overlay.classList.toggle('active');
        }
    }

    // =========================
    // LOAD COMPONENTS
    // =========================

    async function loadComponents(){

        try{

            const menuRes = await fetch('partials/menu.html');
            document.getElementById('sidebar-placeholder').innerHTML =
                await menuRes.text();

            const headerRes = await fetch('partials/header.html');
            document.getElementById('header-placeholder').innerHTML =
                await headerRes.text();

            initPage();

            fetchArticles();

        }catch(error){

            console.error(error);

        }
    }

    // =========================
    // IMAGE MODE
    // =========================

    function switchImageMode(mode){

        const urlCont = document.getElementById('urlInputContainer');
        const fileCont = document.getElementById('fileInputContainer');

        const btns = document.querySelectorAll('.btn-mode');

        if(mode === 'url'){

            urlCont.style.display = 'block';
            fileCont.style.display = 'none';

            btns[0].classList.add('active');
            btns[1].classList.remove('active');

        }else{

            urlCont.style.display = 'none';
            fileCont.style.display = 'block';

            btns[1].classList.add('active');
            btns[0].classList.remove('active');
        }
    }

    function previewImage(mode){

        const img = document.getElementById('imagePreview');

        if(mode === 'url'){

            const url = document.getElementById('image_url').value;

            if(url){

                img.src = url;
                img.style.display = 'block';
            }

        }else{

            const file = document.getElementById('image_file').files[0];

            if(file){

                const reader = new FileReader();

                reader.onload = (e)=>{

                    img.src = e.target.result;
                    img.style.display = 'block';
                };

                reader.readAsDataURL(file);
            }
        }
    }

    // =========================
    // FETCH ARTICLES
    // =========================

    async function fetchArticles(){

        try{

            const res = await fetch(`${API_BASE}/list`);

            const data = await res.json();
            allArticles = data;
            filteredArticles = data; // Au départ, tous les articles sont filtrés
            currentPage = 1; // Réinitialiser la page à chaque nouveau chargement
            selectedArticleIds = []; // Réinitialiser les sélections à chaque rechargement complet

            renderArticles(); // Appeler renderArticles sans argument, il utilisera filteredArticles
            
            // Réinitialiser la case "Tout sélectionner" et le bouton de suppression multiple
            document.getElementById('selectAll').checked = false;
            updateBulkDeleteButton(); // Met à jour l'affichage du bouton et le compteur avec la sélection vide
        }catch(e){

            console.error(e);

            document.getElementById('articleTableBody').innerHTML = `
                <tr>
                    <td colspan="6">Erreur chargement.</td>
                </tr>
            `;
        }
    }

    // =========================
    // RENDER
    // =========================

    function renderArticles(){
        const tbody = document.getElementById('articleTableBody');
        const totalArticles = filteredArticles.length;
        const startIndex = (currentPage - 1) * articlesPerPage;
        const endIndex = Math.min(startIndex + articlesPerPage, totalArticles);

        const articlesToDisplay = filteredArticles.slice(startIndex, endIndex);

        if(!articlesToDisplay.length){
            tbody.innerHTML = `
                <tr>
                    <td colspan="6" style="text-align:center;">Aucun article à afficher sur cette page.</td>
                </tr>
            `;
            updatePaginationControls(totalArticles); // Mettre à jour même s'il n'y a rien
            return;
        }

        tbody.innerHTML = articlesToDisplay.map(art => {
            const displayCat = art.category ? art.category.charAt(0).toUpperCase() + art.category.slice(1) : '<span style="color:#94a3b8;">Non spécifiée</span>';
            
            // On doit s'assurer que l'état de la checkbox est conservé si l'article était sélectionné
            const isChecked = selectedArticleIds.includes(String(art.id)) ? 'checked' : '';

            return `
                <tr>
                    <td class="checkbox-col">
                        <input type="checkbox" class="article-checkbox" value="${art.id}" ${isChecked} onclick="updateBulkDeleteButton()">
                    </td>
                    <td>
                        <img src="${art.image_url || 'https://via.placeholder.com/50'}"
                             class="thumbnail-list">
                    </td>

                    <td>
                        <strong>${art.title}</strong>
                    </td>

                    <td>
                        <span class="badge-category">${displayCat}</span>
                    </td>

                    <td>
                        ${new Date(art.created_at).toLocaleDateString()}
                    </td>

                    <td class="actions">

                        <button class="btn-action btn-view"
                                onclick="viewArticle(${art.id})">

                            <i class="fa-solid fa-eye"></i>

                        </button>

                        <button class="btn-action btn-edit"
                                onclick="editArticle(${art.id})">

                            <i class="fa-solid fa-pen"></i>

                        </button>

                        <button class="btn-action btn-delete"
                                onclick="deleteArticle(${art.id})">

                            <i class="fa-solid fa-trash"></i>

                        </button>

                    </td>

                </tr>
            `;
        }).join('');

        updatePaginationControls(totalArticles);
    }

    // =========================
    // PAGINATION LOGIC
    // =========================

    function updatePaginationControls(totalItems) {
        const controlsContainer = document.getElementById('pagination-controls');
        const totalPages = Math.ceil(totalItems / articlesPerPage);
        controlsContainer.innerHTML = ''; // Nettoyer les contrôles existants

        if (totalPages <= 1) {
            return; // Pas besoin de pagination s'il y a 1 page ou moins
        }

        // Bouton Précédent
        controlsContainer.innerHTML += `
            <button class="pagination-button" ${currentPage === 1 ? 'disabled' : ''} onclick="changePage(${currentPage - 1})">
                &laquo; Précédent
            </button>
        `;

        // Afficher les numéros de page (logique simple pour l'instant)
        // On pourrait implémenter une logique plus complexe pour afficher seulement un sous-ensemble de pages (ex: 1...5, 6, 7...)
        const maxPageButtons = 5; // Nombre max de boutons de page à afficher
        let startPage = Math.max(1, currentPage - Math.floor(maxPageButtons / 2));
        let endPage = Math.min(totalPages, startPage + maxPageButtons - 1);

        if (endPage - startPage + 1 < maxPageButtons) {
            startPage = Math.max(1, endPage - maxPageButtons + 1);
        }


        if (startPage > 1) {
            controlsContainer.innerHTML += `<button class="pagination-button" onclick="changePage(1)">1</button>`;
            if (startPage > 2) {
                controlsContainer.innerHTML += `<span class="pagination-button disabled">...</span>`;
            }
        }

        for (let i = startPage; i <= endPage; i++) {
            controlsContainer.innerHTML += `
                <button class="pagination-button ${currentPage === i ? 'active' : ''}" onclick="changePage(${i})">
                    ${i}
                </button>
            `;
        }

        if (endPage < totalPages) {
            if (endPage < totalPages - 1) {
                controlsContainer.innerHTML += `<span class="pagination-button disabled">...</span>`;
            }
            controlsContainer.innerHTML += `<button class="pagination-button" onclick="changePage(${totalPages})">${totalPages}</button>`;
        }

        // Bouton Suivant
        controlsContainer.innerHTML += `
            <button class="pagination-button" ${currentPage === totalPages ? 'disabled' : ''} onclick="changePage(${currentPage + 1})">
                Suivant &raquo;
            </button>
        `;
    }

    function changePage(pageNumber) {
        if (pageNumber < 1 || pageNumber > Math.ceil(filteredArticles.length / articlesPerPage)) {
            return; // Page invalide
        }
        currentPage = pageNumber;
        renderArticles();
        window.scrollTo({ top: document.querySelector('.crud-container').offsetTop, behavior: 'smooth' });
    }

    // =========================
    // BULK SELECTION & DELETE LOGIC
    // =========================

    // Coche ou décoche toutes les lignes d'un coup
    function toggleSelectAll(masterCheckbox) {
        const checkboxesOnCurrentPage = document.querySelectorAll('.article-checkbox');
        checkboxesOnCurrentPage.forEach(cb => {
            cb.checked = masterCheckbox.checked;
            // Mettre à jour selectedArticleIds
            const articleId = String(cb.value);
            if (cb.checked && !selectedArticleIds.includes(articleId)) {
                selectedArticleIds.push(articleId);
            } else if (!cb.checked && selectedArticleIds.includes(articleId)) {
                selectedArticleIds = selectedArticleIds.filter(id => id !== articleId);
            }
        });
        updateBulkDeleteButton();
    }

    // Gère la visibilité du bouton de suppression multiple et met à jour le compteur
    function updateBulkDeleteButton() {
        // Mettre à jour selectedArticleIds basé sur l'état actuel des checkboxes de la page
        const checkboxesOnCurrentPage = document.querySelectorAll('.article-checkbox');
        checkboxesOnCurrentPage.forEach(cb => {
            const articleId = String(cb.value);
            if (cb.checked && !selectedArticleIds.includes(articleId)) {
                selectedArticleIds.push(articleId);
            } else if (!cb.checked && selectedArticleIds.includes(articleId)) {
                selectedArticleIds = selectedArticleIds.filter(id => id !== articleId);
            }
        });

        const btnBulkDelete = document.getElementById('btnBulkDelete');
        const selectedCountSpan = document.getElementById('selectedCount');
        const masterCheckbox = document.getElementById('selectAll');

        selectedCountSpan.innerText = selectedArticleIds.length;

        // Affiche le bouton s'il y a au moins un élément coché globalement
        if (selectedArticleIds.length > 0) {
            btnBulkDelete.style.display = 'block';
        } else {
            btnBulkDelete.style.display = 'none';
        }

        // Ajuster l'état de la checkbox "Tout sélectionner" de la page actuelle
        const allCheckedOnPage = checkboxesOnCurrentPage.length > 0 && Array.from(checkboxesOnCurrentPage).every(cb => cb.checked);
        const anyCheckedOnPage = Array.from(checkboxesOnCurrentPage).some(cb => cb.checked);

        if (allCheckedOnPage) {
            masterCheckbox.checked = true;
            masterCheckbox.indeterminate = false;
        } else if (anyCheckedOnPage) {
            masterCheckbox.checked = false;
            masterCheckbox.indeterminate = true;
        } else {
            masterCheckbox.checked = false;
            masterCheckbox.indeterminate = false;
        }
    }

    // Supprime tous les articles sélectionnés globalement
    async function deleteSelectedArticles() {
        if (selectedArticleIds.length === 0) return;

        if (!confirm(`Voulez-vous vraiment supprimer ces ${selectedArticleIds.length} articles ?`)) return;

        const btnBulkDelete = document.getElementById('btnBulkDelete');
        const originalBtnHTML = btnBulkDelete.innerHTML;

        btnBulkDelete.disabled = true;
        btnBulkDelete.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Suppression...`;

        try {
            const deletePromises = selectedArticleIds.map(id => 
                fetch(`${API_BASE}/delete/${id}`, { method: 'POST' })
            );

            await Promise.all(deletePromises);

            showFlash(`${selectedArticleIds.length} articles supprimés avec succès.`, 'success');
            selectedArticleIds = []; // Réinitialiser après suppression
            
        } catch (err) {
            console.error("Erreur lors de la suppression :", err);
            showFlash("Une erreur est survenue lors de la suppression groupée.", 'error');
        } finally {
            btnBulkDelete.disabled = false;
            btnBulkDelete.innerHTML = originalBtnHTML;
            btnBulkDelete.style.display = 'none'; // Cacher le bouton après la suppression
            
            setTimeout(() => {
                fetchArticles(); // Recharger les articles et la pagination
                currentPage = 1; // Revenir à la première page
            }, 300);
        }
    }

    // =========================
    // VIEW ARTICLE
    // =========================

    function viewArticle(id){

        const art = allArticles.find(a => a.id == id);

        if(!art) return;

        document.getElementById('modalTitle').innerText = art.title;

        document.getElementById('modalContent').innerText = art.content;

        document.getElementById('modalImage').src =
            art.image_url || 'https://via.placeholder.com/600';

        document.getElementById('viewModal').style.display = 'flex';
    }

    // =========================
    // CLOSE MODAL
    // =========================

    function closeModal(){

        document.getElementById('viewModal').style.display = 'none';
    }
	
	function deconnexion() {

        if (confirm("Voulez-vous fermer votre session ?")) {

            localStorage.clear();

            window.location.replace('../login/connexion.html');
        }
    }

    // =========================
    // EDIT ARTICLE
    // =========================

    function editArticle(id){

        const art = allArticles.find(a => a.id == id);

        if(!art) return;

        document.getElementById('articleId').value = art.id;

        document.getElementById('title').value = art.title;

        document.getElementById('category').value = art.category || '';

        document.getElementById('content').value = art.content;

        document.getElementById('image_url').value =
            art.image_url || '';

        previewImage('url');

        document.getElementById('btnSubmit').innerHTML = `
            <i class="fa-solid fa-save"></i>
            METTRE À JOUR
        `;

        window.scrollTo({
            top:0,
            behavior:'smooth'
        });
    }

    // =========================
    // CREATE / UPDATE
    // =========================

    document.getElementById('articleForm')
        .addEventListener('submit', async function(e){

        e.preventDefault();

        const id = document.getElementById('articleId').value;

        const btn = document.getElementById('btnSubmit');

        const articleData = {

            title: document.getElementById('title').value,

            category: document.getElementById('category').value,

            content: document.getElementById('content').value,

            image_url: document.getElementById('image_url').value
        };

        btn.disabled = true;

        btn.innerHTML = `
            <i class="fa-solid fa-spinner fa-spin"></i>
            TRAITEMENT...
        `;

        const url = id
            ? `${API_BASE}/update/${id}`
            : `${API_BASE}/add`;

        const method = 'POST';

        try{

            const res = await fetch(url, {

                method: method,

                headers:{
                    'Content-Type':'application/json'
                },

                body: JSON.stringify(articleData)
            });

            if(!res.ok){

                throw new Error("Erreur API");
            }

            // Remplacement de l'alerte par le message flash
            showFlash(id ? "Article mis à jour avec succès !" : "Article publié avec succès !", 'success');

            this.reset();

            document.getElementById('articleId').value = '';

            document.getElementById('imagePreview').style.display = 'none';

            btn.innerHTML = `
                <i class="fa-solid fa-paper-plane"></i>
                PUBLIER L'ARTICLE
            `;

            fetchArticles();

        }catch(err){

            console.error(err);

            showFlash("Erreur serveur lors de l'enregistrement.", 'error');

        }finally{

            btn.disabled = false;
        }
    });

    // =========================
    // DELETE (SINGLE)
    // =========================

    async function deleteArticle(id){

        if(!confirm("Supprimer cet article ?")) return;

        try{

            const res = await fetch(`${API_BASE}/delete/${id}`, {
                method:'POST'
            });

            if(!res.ok){
                throw new Error("Erreur suppression");
            }

            // Remplacement de l'alerte par le message flash
            showFlash("Article supprimé avec succès.", 'success');
            
            // Retirer l'article supprimé de la sélection multiple si présent
            selectedArticleIds = selectedArticleIds.filter(id => id !== String(id));

            fetchArticles(); // Recharger les articles et la pagination

        }catch(err){

            console.error(err);
            showFlash("Erreur lors de la suppression.", 'error');
        }
    }

    // =========================
    // AUTH
    // =========================

    function initPage(){
        const rawData = localStorage.getItem('user_full_data');

        if(!rawData){
            window.location.replace('../login/connexion.html');
            return;
        }

        try {
            const userData = JSON.parse(rawData);
            const roles = userData.roles || userData.role || [];
            const isWordAdmin = Array.isArray(roles) 
                ? roles.some(r => r.trim().toUpperCase() === 'ROLE_ADMIN')
                : (typeof roles === 'string' && roles.trim().toUpperCase() === 'ROLE_ADMIN');

            if (isWordAdmin) {
                document.body.style.opacity = "1";
            } else {
                alert("Page introuvable.");
                window.location.replace('connexion.html');
            }
        } catch (e) {
            console.error("Erreur de lecture de session :", e);
            window.location.replace('connexion.html');
        }
    }

    window.onload = loadComponents;

</script>

</body>
