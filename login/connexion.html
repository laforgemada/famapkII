<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apokalypsy - Connexion</title>
    <style>
        :root {
            --primary: #1E3A8A;
            --bg: #f3f4f6;
        }

        body { 
            font-family: 'Segoe UI', sans-serif; 
            margin: 0; 
            background: var(--bg); 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            height: 100vh; 
        }

        .login-card {
            background: white;
            width: 90%;
            max-width: 400px;
            padding: 40px 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            text-align: center;
        }

        .logo-login {
            font-size: 2rem;
            font-weight: 900;
            color: var(--primary);
            margin-bottom: 10px;
        }

        h2 { margin-bottom: 30px; color: #333; font-size: 1.2rem; }

        input {
            width: 100%;
            padding: 15px;
            margin-bottom: 20px;
            border: 1px solid #ddd;
            border-radius: 10px;
            box-sizing: border-box;
            background: #f9f9f9;
        }

        button {
            width: 100%;
            padding: 15px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 10px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.3s;
        }

        button:disabled {
            background: #9ca3af;
            cursor: not-allowed;
        }

        button:active { transform: scale(0.98); }

        .social-separator {
            margin: 20px 0;
            display: flex;
            align-items: center;
            color: #9ca3af;
            font-size: 0.8rem;
        }
        .social-separator::before, .social-separator::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid #e5e7eb;
            margin: 0 10px;
        }
        .btn-social {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: white;
            color: #3c4043;
            border: 1px solid #dadce0;
            margin-bottom: 12px;
            padding: 12px;
        }
        .btn-social img { width: 18px; opacity: 0.6; }
        
        .btn-social:disabled {
            background-color: #f3f4f6;
            color: #9ca3af;
            border-color: #e5e7eb;
            cursor: not-allowed;
        }

        .footer-links { margin-top: 25px; font-size: 0.9rem; color: #666; }
        
        .footer-links a.disabled-link { 
            color: #9ca3af; 
            text-decoration: none; 
            font-weight: bold; 
            pointer-events: none; 
            cursor: not-allowed; 
        }
        
        .back-home { margin-top: 20px; display: block; color: #999; text-decoration: none; font-size: 0.8rem; }
        
        #error-msg { color: #dc2626; font-size: 0.9rem; margin-bottom: 15px; display: none; }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="logo-login">APOKALYPSY</div>
        <h2>Espace Membre</h2>

        <div id="error-msg"></div>

        <form id="loginForm">
            <input type="text" id="identifier" placeholder="Email ou Pseudo" required>
            <input type="password" id="password" placeholder="Mot de passe" required>
            
            <button type="submit" id="btnSubmit">SE CONNECTER</button>
        </form>

        <div class="social-separator">OU</div>

        <button type="button" class="btn-social" onclick="handleSocialLogin('google')">
            <img src="https://fonts.gstatic.com/s/i/productlogos/googleg/v6/24px.svg" alt="">
            <span>Google</span>
        </button>

        <button type="button" class="btn-social" onclick="handleSocialLogin('facebook')" disabled>
            <img src="https://upload.wikimedia.org/wikipedia/commons/b/b8/2021_Facebook_icon.svg" alt="">
            <span>Facebook (En maintenance)</span>
        </button>

        <div class="footer-links">
            Pas encore membre ? <a href="#" class="disabled-link">Inscription (En maintenance)</a>
        </div>

        <a href="../../" class="back-home">← Retour à l'accueil</a>
    </div>

    <script>
        function handleSocialLogin(provider) {
            if (provider === 'google') {
                // On indique au backend où nous ramener une fois la connexion Google terminée
                // (s'adapte automatiquement à l'environnement : localhost en dev, apokalypsy.com en prod)
                const redirectUrl = window.location.origin + '/utilisateur/espace_personnel.html';
                window.location.href = 'https://apokalypsy.com/connect/google?redirect=' + encodeURIComponent(redirectUrl);
                return;
            }
            // Facebook reste désactivé (bouton "disabled" côté HTML)
        }

        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const btn = document.getElementById('btnSubmit');
            const errorDiv = document.getElementById('error-msg');
            const identifier = document.getElementById('identifier').value;
            const password = document.getElementById('password').value;

            errorDiv.style.display = "none";
            btn.disabled = true;
            btn.innerText = "CONNEXION EN COURS...";

            try {
                const response = await fetch('https://apokalypsy.com/api/mobile/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        username: identifier, 
                        password: password 
                    })
                });

                const data = await response.json();

                if (response.ok && data.status === 'success') {
                    localStorage.setItem('user_name', data.userData.username);
                    localStorage.setItem('user_full_data', JSON.stringify(data.userData));
                    localStorage.setItem('token', data.token);
                    
                    const roles = data.userData.roles;

                    if (roles.includes('ROLE_ADMIN') || roles.includes('ROLE_REDACTEUR')) {
                        window.location.replace('../admin/dashboard_admin.html');
                    } else {
                        window.location.replace('../utilisateur/espace_personnel.html');
                    }

                } else {
                    errorDiv.textContent = data.message || "Identifiants incorrects.";
                    errorDiv.style.display = "block";
                    btn.disabled = false;
                    btn.innerText = "SE CONNECTER";
                }
            } catch (error) {
                errorDiv.textContent = "Erreur de liaison avec le serveur.";
                errorDiv.style.display = "block";
                btn.disabled = false;
                btn.innerText = "SE CONNECTER";
            }
        });
    </script>

</body>
</html>
