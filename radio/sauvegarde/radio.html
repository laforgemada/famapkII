<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Radio Fanambarana</title>

    <link
        rel="stylesheet"
        href="radio-player.css"
    >

</head>

<body>

    <main id="radio-global-player">

        <!-- =========================
             EN-TETE
        ========================== -->

        <div class="radio-window-header">

            <div class="radio-brand">

                <div class="radio-brand-icon">
                    RADIO
                </div>

                <div>

                    <div class="radio-live">
                        <span class="radio-live-dot"></span>
                        EN DIRECT
                    </div>

                    <strong>
                        Radio Fanambarana
                    </strong>

                    <small>
                        98.4 FM - La radio de la Parole
                    </small>

                </div>

            </div>

        </div>


        <!-- =========================
             LECTEUR
        ========================== -->

        <div class="radio-global-main">

            <button
                type="button"
                id="radio-global-play"
                class="radio-global-button"
                aria-label="Ecouter Radio Fanambarana"
            >
                PLAY
            </button>


            <div class="radio-global-info">

                <strong>
                    Radio Fanambarana
                </strong>

                <span>
                    Ecoutez la Parole en direct
                </span>

            </div>


            <div class="radio-global-time">

                <span id="radio-global-time">
                    00:00:00
                </span>

            </div>


            <!-- =========================
                 VOLUME
            ========================== -->

            <div class="radio-volume-wrapper">

                <span>
                    VOL
                </span>

                <input
                    id="radio-global-volume"
                    class="radio-global-volume"
                    type="range"
                    min="0"
                    max="1"
                    step="0.01"
                    value="1"
                    aria-label="Volume"
                >

            </div>


            <!-- =========================
                 FERMER
            ========================== -->

            <button
                type="button"
                id="radio-global-close"
                class="radio-global-close"
                aria-label="Fermer"
            >
                X
            </button>

        </div>


        <!-- =========================
             TEMPS D'ECOUTE
        ========================== -->

        <section class="radio-reward-panel">

            <div class="radio-reward-header">

                <div>

                    <span class="radio-reward-label">
                        TEMPS D'ECOUTE
                    </span>

                    <strong id="radio-listening-time">
                        00:00:00
                    </strong>

                </div>


                <div class="radio-reward-next">

                    <span>
                        PROCHAIN GAIN
                    </span>

                    <strong id="radio-next-reward">
                        30 min - +3 points
                    </strong>

                </div>

            </div>


            <!-- =========================
                 PROGRESSION
            ========================== -->

            <div class="radio-progress-container">

                <div
                    class="radio-progress-bar"
                    id="radio-progress-bar"
                ></div>

            </div>


            <!-- =========================
                 MESSAGE RECOMPENSE
            ========================== -->

            <div
                class="radio-reward-message"
                id="radio-reward-message"
            >

                Ecoutez Radio Fanambarana pendant
                <strong>30 minutes</strong>
                pour gagner
                <strong>+3 points</strong>.

            </div>

        </section>


        <!-- =========================
             AUDIO
        ========================== -->

        <audio
            id="radio-global-audio"
            preload="none"
        ></audio>


    </main>


    <!-- =========================
         JAVASCRIPT
    ========================== -->

    <script src="radio-player.js"></script>

</body>

</html>
