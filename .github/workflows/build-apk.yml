name: Générer APK Android
on:
  workflow_dispatch:

jobs:
  build:
    name: Compilation de l'APK
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Télécharger le projet
        uses: actions/checkout@v4

      - name: ⚙️ Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: ☕ Installer Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 17

      - name: 🤖 Installer Android SDK
        uses: android-actions/setup-android@v3

      - name: 📦 Installer Bubblewrap
        run: |
          npm install -g @bubblewrap/cli

      - name: 🔧 Pré-configurer Bubblewrap (évite le prompt interactif)
        run: |
          mkdir -p "$HOME/.bubblewrap"
          cat << EOF > "$HOME/.bubblewrap/config.json"
          {
            "jdkPath": "$JAVA_HOME",
            "androidSdkPath": "$ANDROID_SDK_ROOT"
          }
          EOF
          cat "$HOME/.bubblewrap/config.json"

      - name: 📱 Créer la configuration de l'application
        run: |
          mkdir -p android-app
          cd android-app

          cat << EOF > twa-manifest.json
          {
            "packageId": "com.laforgemada.famapkii",
            "host": "app.apokalypsy.com",
            "name": "Fam Apokalypsy",
            "shortName": "FamApok",
            "startUrl": "/",
            "display": "standalone",
            "themeColor": "#1E3A8A",
            "navigationColor": "#000000",
            "backgroundColor": "#FFFFFF",
            "enableNotifications": true,
            "iconUrl": "https://app.apokalypsy.com/icons/icon-512.png",
            "maskableIconUrl": "https://app.apokalypsy.com/icons/icon-512.png",
            "splashScreenFadeOutDuration": 300,
            "generatorApp": "bubblewrap-cli",
            "signingKey": {
              "path": "android.keystore",
              "alias": "androiddebugkey"
            },
            "appVersionName": "1.0",
            "appVersionCode": 1,
            "shortcuts": [],
            "generatorToolkit": "cli",
            "features": {},
            "alphaDependencies": {
              "enabled": false
            },
            "minSdkVersion": 21,
            "compileSdkVersion": 33,
            "targetSdkVersion": 33
          }
          EOF

      - name: 🔑 Générer la clé Android
        run: |
          keytool -genkeypair \
          -keystore android-app/android.keystore \
          -storepass pass1234 \
          -keypass pass1234 \
          -alias androiddebugkey \
          -keyalg RSA \
          -keysize 2048 \
          -validity 10000 \
          -dname "CN=Fam Apokalypsy"

      - name: 🔄 Générer le projet Android (update)
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: pass1234
          BUBBLEWRAP_KEY_PASSWORD: pass1234
        run: |
          cd android-app
          bubblewrap update --skipVersionUpgrade

      - name: 🏗️ Compiler APK
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: pass1234
          BUBBLEWRAP_KEY_PASSWORD: pass1234
        run: |
          cd android-app
          bubblewrap build \
          --skipPwaValidation \
          --keyStorePassword pass1234 \
          --keyPassword pass1234

      - name: 📤 Télécharger APK
        uses: actions/upload-artifact@v4
        with:
          name: Fam-Apokalypsy-APK
          path: android-app/*.apk
